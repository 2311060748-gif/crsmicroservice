spring.application.name=auth-service

server.port=${SERVER_PORT:8081}
spring.datasource.url=jdbc:mysql://localhost:3306/auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=student
spring.datasource.password=student

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Use a different Base64-encoded secret in every deployed environment.
jwt.secret=${JWT_SECRET:VGhpc0lzQURldmVsb3BtZW50U2VjcmV0VGhhdE11c3RCZVJlcGxhY2VkSW5Qcm9kdWN0aW9uIQ==}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Optional one-time admin bootstrap. Set both environment variables before the first start.
auth.bootstrap-admin.username=${ADMIN_USERNAME:}
auth.bootstrap-admin.password=${ADMIN_PASSWORD:}
