spring.application.name=course-microservices
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8082}
spring.datasource.url=jdbc:mysql://localhost:3306/course_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
