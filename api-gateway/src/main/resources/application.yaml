spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: "${AUTH_SERVICE_URL:http://localhost:8081}"
              predicates:
                - Path=/api/auth/**,/api/admin/**
            - id: course-service
              uri: "${COURSE_SERVICE_URL:http://localhost:8082}"
              predicates:
                - Path=/api/courses/**
              filters:
                - StripPrefix=1
            - id: registration-service
              uri: "${REGISTRATION_SERVICE_URL:http://localhost:8083}"
              predicates:
                - Path=/api/registrations/**
              filters:
                - StripPrefix=1

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:VGhpc0lzQURldmVsb3BtZW50U2VjcmV0VGhhdE11c3RCZVJlcGxhY2VkSW5Qcm9kdWN0aW9uIQ==}
